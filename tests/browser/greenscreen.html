<!doctype html>
<html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthetic greenscreen pixel checks</title>
<style>body{font:16px/1.5 system-ui;margin:24px;max-width:900px;color:#233b2e}canvas{display:block;width:512px;max-width:100%;height:auto;border:1px solid #899b91;background:repeating-conic-gradient(#dde5dc 0 25%,#fff 0 50%) 0/20px 20px}button{padding:12px;font:inherit}pre{white-space:pre-wrap}</style></head>
<body><h1>Synthetic greenscreen pixel checks</h1><p>Real WebGL renderer, generated color patches only. No provider, camera, microphone or network video.</p>
<button id="run">Run synthetic frame checks</button><p>Input: provider key green, skin, dark clothing, blended edge.</p><canvas id="source" width="512" height="128"></canvas><p>Output over a transparency checkerboard:</p><canvas id="result"></canvas><pre id="evidence" aria-live="polite">Ready</pre>
<script type="module">
import { GreenscreenSurface } from '/__fixture/greenscreen-module.js';
const source=document.getElementById('source'),output=document.getElementById('result'),evidence=document.getElementById('evidence');
const context=source.getContext('2d');
const colors=['rgb(0,255,155)','rgb(211,148,111)','rgb(20,25,30)','rgb(25,230,150)'];
colors.forEach((color,i)=>{context.fillStyle=color;context.fillRect(i*128,0,128,128);});
document.getElementById('run').onclick=()=>{
  let surface;
  try {
    const results=[];
    for(let attempt=0;attempt<2;attempt++) {
      surface=new GreenscreenSurface(output);surface.draw(source,source.width,source.height);
      const gl=output.getContext('webgl'),pixels=colors.map((_,i)=>{const p=new Uint8Array(4);gl.readPixels(i*128+64,64,1,1,gl.RGBA,gl.UNSIGNED_BYTE,p);return Array.from(p);});
      const alpha=pixels.map(p=>p[3]);
      const checks={transparentKey:alpha[0]<=1,opaqueSkin:alpha[1]>=254,opaqueClothing:alpha[2]>=254,featheredEdge:alpha[3]>0&&alpha[3]<254,skinColorPreserved:pixels[1].slice(0,3).every((v,i)=>Math.abs(v-[211,148,111][i])<=2),edgePremultiplied:pixels[3].slice(0,3).every(v=>v<=alpha[3]+1)};
      results.push({renderer:attempt+1,checks,pixels,pass:Object.values(checks).every(Boolean)});surface.dispose();surface=undefined;
    }
    evidence.textContent=JSON.stringify({pass:results.every(r=>r.pass),reinitializedAfterDispose:true,results},null,2);
  } catch { evidence.textContent=JSON.stringify({pass:false,reason:'WebGL renderer unavailable'}); }
  finally {surface?.dispose();}
};
</script></body></html>
