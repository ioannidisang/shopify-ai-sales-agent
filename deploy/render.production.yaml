# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Approved assistant deployment configuration. Secrets are supplied in Render.
# Existing PostgreSQL resource: shopify-ai-sales-agent-db
# Verified resource ID: dpg-dauvg4o473hc73crqerg-a
# PostgreSQL 16, Frankfurt, basic-256mb, 1 GB; external access disabled.
# Deliberately no databases block: reference the existing instance, never create a duplicate.

services:
  - type: web
    name: shopify-ai-sales-agent
    runtime: docker
    repo: https://github.com/ioannidisang/shopify-ai-sales-agent
    branch: codex/shopify-ai-sales-agent
    region: frankfurt
    plan: starter
    numInstances: 1
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node dist/apps/server/src/index.js
    healthCheckPath: /readyz
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: APP_URL
        sync: false
      - key: ALLOWED_SHOPS
        value: ym5fhx-fa.myshopify.com
      - key: SCOPES
        value: unauthenticated_read_product_listings,read_pixels,write_pixels,read_customer_events,write_app_proxy
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MAX
        value: "2"
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DB_QUERY_TIMEOUT_MS
        value: "10000"
      - key: ENCRYPTION_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini-2025-04-14
      # Both provider keys are required before enabling the three-arm experiment.
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-small-2603

  - type: cron
    name: shopify-ai-sales-agent-migrator
    runtime: docker
    repo: https://github.com/ioannidisang/shopify-ai-sales-agent
    branch: codex/shopify-ai-sales-agent
    region: frankfurt
    plan: starter
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node dist/apps/server/src/migrate.js
    # This release requires schema v2 before first runtime-role provisioning/startup.
    # A schedule is required; this is not a manual-only setting.
    # Suspend scheduled execution between intentional migration runs.
    # One-time runtime-role provisioning is documented in RENDER-DEPLOYMENT.md;
    # its temporary password/mode are deliberately absent from this file.
    schedule: "0 0 1 1 *"
    envVars:
      - key: NODE_ENV
        value: production
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: shopify-ai-sales-agent-db
          property: connectionString
      - key: MIGRATION_EXPECTED_DATABASE
        value: sales_agent_production
      - key: DB_POOL_MAX
        value: "1"
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: DB_QUERY_TIMEOUT_MS
        value: "10000"
